<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Créer un compte')}"></head>
<body class="bg-light">
<div class="container" style="max-width: 420px; margin-top: 10vh;">
    <div class="card p-4">
        <h4 class="mb-3 text-center">Créer un compte</h4>
        <div class="alert alert-danger" th:if="${param.error}">Erreur lors de la création du compte.</div>
        <form th:action="@{/register}" method="post">
            <div class="mb-3">
                <label class="form-label" for="username">Nom d'utilisateur</label>
                <input class="form-control" id="username" name="username" autofocus required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Mot de passe</label>
                <input class="form-control" id="password" name="password" type="password" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="confirmPassword">Confirmer le mot de passe</label>
                <input class="form-control" id="confirmPassword" name="confirmPassword" type="password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Créer le compte</button>
        </form>
        <div class="mt-3 text-center">
            <a th:href="@{/login}" class="text-decoration-none">Déjà un compte ? Se connecter</a>
        </div>
    </div>
</div>
</body>
</html>
