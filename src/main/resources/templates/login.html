<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Connexion')}"></head>
<body class="bg-light">
<div class="container" style="max-width: 420px; margin-top: 10vh;">
    <div class="card p-4">
        <h4 class="mb-3 text-center">Transport &amp; Livraison</h4>
        <div class="alert alert-danger" th:if="${param.error}">Identifiants incorrects</div>
        <div class="alert alert-info" th:if="${param.logout}">Vous êtes déconnecté</div>
        <div class="alert alert-success" th:if="${param.registered}">Compte créé avec succès. Vous pouvez maintenant vous connecter.</div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label" for="username">Nom d'utilisateur</label>
                <input class="form-control" id="username" name="username" autofocus required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Mot de passe</label>
                <input class="form-control" id="password" name="password" type="password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Se connecter</button>
        </form>
        <div class="mt-3 text-center">
            <a th:href="@{/register}" class="text-decoration-none">Créer un compte</a>
        </div>
        <p class="text-muted small mt-3 mb-0">Démo : admin/admin123 · manager/manager123 · operator/operator123 · user/user123</p>
    </div>
</div>
</body>
</html>
