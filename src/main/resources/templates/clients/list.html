<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Clients')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex justify-content-between mb-3">
        <h3>Clients</h3>
        <a class="btn btn-primary" th:href="@{/clients/new}" sec:authorize="hasAnyRole('ADMIN','MANAGER','OPERATOR')">+ Nouveau client</a>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/clients}">
        <div class="col-md-5"><input class="form-control" name="q" th:value="${q}" placeholder="Nom, téléphone, email..."></div>
        <div class="col-md-4">
            <select class="form-select" name="sort">
                <option value="id,desc" th:selected="${sort == 'id,desc'}">Plus récents</option>
                <option value="nom,asc" th:selected="${sort == 'nom,asc'}">Nom A → Z</option>
                <option value="nom,desc" th:selected="${sort == 'nom,desc'}">Nom Z → A</option>
            </select>
        </div>
        <div class="col-md-3"><button class="btn btn-outline-secondary w-100">Filtrer</button></div>
    </form>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>Nom</th><th>Téléphone</th><th>Email</th><th>Adresse</th><th></th></tr></thead>
                <tbody>
                <tr th:each="c : ${page.content}">
                    <td th:text="${(c.prenom != null ? c.prenom + ' ' : '') + c.nom}">Nom</td>
                    <td th:text="${c.telephone}">Tel</td>
                    <td th:text="${c.email} ?: '-'">Email</td>
                    <td th:text="${c.adresse} ?: '-'">Adresse</td>
                    <td class="text-end" sec:authorize="hasAnyRole('ADMIN','MANAGER','OPERATOR')">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/clients/{id}/edit(id=${c.id})}">Modifier</a>
                        <form class="d-inline" th:action="@{/clients/{id}/delete(id=${c.id})}" method="post"
                              onsubmit="return confirm('Supprimer ce client ?');">
                            <button class="btn btn-sm btn-outline-danger">Supprimer</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${page.empty}"><td colspan="5" class="text-center text-muted py-4">Aucun client</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <p class="text-muted small mt-2"><span th:text="${page.totalElements}">0</span> résultat(s)</p>
    <nav th:replace="~{fragments/layout :: pagination(${page}, '/clients', ${query})}"></nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
